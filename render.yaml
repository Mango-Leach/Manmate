services:
  # Backend Service
  - type: web
    name: stress-relief-backend
    env: node
    rootDir: backend
    plan: free # Optional: defaults to starter/free depending on account
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Prompt user for value
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://stress-relief-frontend.onrender.com
      - key: BACKEND_URL
        value: https://stress-relief-backend.onrender.com
      - key: GOOGLE_CALLBACK_URL
        value: https://stress-relief-backend.onrender.com/api/auth/google/callback
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        value: https://stress-relief-frontend.onrender.com/therapist
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false # Gmail address used for sending emails
      - key: SMTP_PASSWORD
        sync: false # Gmail App Password (16-char, spaces removed)
      - key: EMAIL_FROM
        sync: false # Same as SMTP_USER

  # Frontend Service
  - type: web
    name: stress-relief-frontend
    env: node
    rootDir: frontend
    plan: free
    # Ensure devDependencies (like tailwindcss) are installed for the build
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://stress-relief-backend.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://stress-relief-frontend.onrender.com
