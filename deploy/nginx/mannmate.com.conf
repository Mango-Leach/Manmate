# ───────────────────────────────────────────────────────────────────────────
# Nginx site config for mannmate.com (StressReliefChat)
#
# Reverse proxy on a single domain:
#   https://mannmate.com/            -> Next.js frontend  (127.0.0.1:3100)
#   https://mannmate.com/api/        -> Express API       (127.0.0.1:5100)
#   https://mannmate.com/health      -> Express API       (127.0.0.1:5100)
#   https://mannmate.com/socket.io/  -> Socket.IO / WebRTC signaling (127.0.0.1:5100)
#
# Install:
#   sudo cp deploy/nginx/mannmate.com.conf /etc/nginx/sites-available/mannmate.com
#   sudo ln -s /etc/nginx/sites-available/mannmate.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default        # remove the welcome page
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then enable HTTPS (Certbot rewrites this file to add the :443 server block
# and an http->https redirect automatically):
#   sudo certbot --nginx -d mannmate.com -d www.mannmate.com
# ───────────────────────────────────────────────────────────────────────────

# Required so WebSocket upgrades (Socket.IO) are proxied correctly.
# This `map` lives in the http context — fine here, as sites are included in it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mannmate.com www.mannmate.com;

    # Audio/transcription uploads — backend accepts request bodies up to 30 MB.
    client_max_body_size 35m;

    # Compress API/JSON responses (Next.js already gzips its own output).
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

    # ---- Express API ----
    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Health check (no access logging noise) ----
    location /health {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- Socket.IO — long-lived WebSocket for WebRTC signaling & matchmaking ----
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;   # keep signaling sockets open (24h)
        proxy_send_timeout 86400s;
    }

    # ---- Next.js frontend (everything else) ----
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
